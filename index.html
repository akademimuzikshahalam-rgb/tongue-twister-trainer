<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Speak Up! — Tongue Twister Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#667eea; --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --bg:#f6f9ff;
  }
  *{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e6eefc 0,#f8fafc 100%);display:flex;align-items:center;justify-content:center;padding:18px;}
  .app { width: 100%; max-width: 980px; background:white;border-radius:14px;box-shadow:0 12px 40px rgba(8,15,40,0.12); overflow:hidden; }
  header{background:linear-gradient(135deg,var(--accent),#764ba2);color:white;padding:18px 20px;display:flex;align-items:center;gap:14px;position:relative;}
  header .logo-wrap{display:flex;align-items:center;gap:12px;}
  header img.logo{height:46px; width:auto; object-fit:contain; display:inline-block;}
  header object.logo-pdf{height:46px;width:auto; display:none;border:none;}
  header h1{font-family:Poppins, sans-serif;margin:0;font-size:20px;font-weight:700;letter-spacing:0.3px;}
  header p{margin:0;font-size:12px;opacity:0.95;}

  main{padding:20px;}
  .title-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px;}
  .title-row h2{margin:0;font-size:24px;font-weight:700;color:var(--accent);font-family:Poppins;}
  .title-row .subtitle{font-size:13px;color:#334155;}

  .controls {display:flex;gap:12px;justify-content:center;margin-bottom:16px;}
  .controls button{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
  .btn-easy{background:#10b981;color:white}
  .btn-medium{background:var(--orange);color:white}
  .btn-hard{background:var(--red);color:white}

  .twister-card { border-radius:12px; background: linear-gradient(180deg,#ffffff,#fbfdff); padding:22px; box-shadow: 0 6px 18px rgba(18,38,71,0.06); text-align:center; margin-bottom:10px; }
  .twister-text{font-size:28px;font-weight:700;color:#0f172a; line-height:1.15; padding:6px 8px;}
  .nav-under { display:flex; gap:12px; justify-content:center; margin-top:12px; }
  .nav-under button{padding:8px 14px;border-radius:8px;border:1px solid #e6eefc;background:white;color:var(--accent);font-weight:700;cursor:pointer}
  .instruction { text-align:center; margin-top:8px; font-weight:800; color:#0f172a; font-size:15px; }

  .stage { display:flex; gap:18px; align-items:center; margin-top:18px; justify-content:space-between; }
  .left, .center, .right { background:transparent; display:flex; align-items:center; justify-content:center; }
  .left { width:170px; flex-direction:column; gap:10px; }
  .center { flex:1; display:flex; justify-content:center; }
  .right { width:170px; flex-direction:column; gap:10px; }

  /* microphone button */
  .mic-button { width:120px; height:120px; border-radius:999px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:white; cursor:pointer; box-shadow:0 8px 20px rgba(8,15,40,0.08); border:none; background:var(--green); transition:transform .12s, background .18s; }
  .mic-button:active{ transform:scale(.98); }
  .mic-button.listening{ background:var(--red); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(239,68,68,0.5);} 50%{box-shadow:0 0 0 18px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }

  /* vertical mic bar (center) */
  .mic-meter-wrap{ width:40px; height:150px; background:#eef2ff;border-radius:12px;padding:6px; display:flex; align-items:flex-end; justify-content:center; }
  .mic-meter { width:100%; border-radius:8px; background:linear-gradient(#60a5fa,#f59e0b,#ef4444); height:6px; transform-origin:left center; transition:height .06s linear; }

  /* score ring */
  .score-ring { width:140px; height:140px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:conic-gradient(var(--accent) var(--score-percent,0%), #eef2ff var(--score-percent,0%)); box-shadow:0 10px 22px rgba(8,15,40,0.06); }
  .score-inner { width:112px; height:112px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:40px; color:var(--accent); box-shadow: inset 0 2px 6px rgba(0,0,0,0.03); }

  .transcript { margin-top:12px; min-height:36px; font-weight:700; color:#0f172a; display:none; padding:8px 12px; background:#fbfdff; border-radius:8px; border:1px solid #eef2ff; }

  .footer-note { margin-top:20px; text-align:center; font-weight:700; color:#0f172a; padding:10px 12px; border-top:1px dashed #eef2ff; }

  /* responsive */
  @media (max-width:860px){
    .stage { flex-direction:column; align-items:stretch; }
    .left, .center, .right { width:100%; justify-content:center; }
    .mic-button { width:96px; height:96px; }
    .mic-meter-wrap{ height:130px; }
    .score-ring{ width:112px;height:112px; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="logo-wrap">
        <!-- image fallback order:
             1) local ./Speak Up Logo.png (if you add a PNG in repo root)
             2) GitHub raw PDF (Speak Up Logo.pdf) loaded into <object>
             3) hide logo if none available
        -->
        <img class="logo" id="logoImg" alt="Speak Up Logo" src="" />
        <object id="logoObj" class="logo-pdf" type="application/pdf" data="" width="46" height="46" aria-hidden="true"></object>
      </div>
      <div>
        <h1>Tongue Twister Trainer</h1>
        <p>Speak clearly — accuracy, clarity & speed scored out of 10</p>
      </div>
    </header>

    <main>
      <div class="title-row">
        <h2>Tongue Twister Trainer</h2>
        <div class="subtitle">Choose a level and press the mic to start</div>
      </div>

      <div style="display:flex;justify-content:center;margin-bottom:12px;">
        <div class="controls" role="tablist" aria-label="difficulty levels">
          <button id="btnEasy" class="btn-easy">Easy</button>
          <button id="btnMed" class="btn-medium">Medium</button>
          <button id="btnHard" class="btn-hard">Hard</button>
        </div>
      </div>

      <!-- Twister card -->
      <div class="twister-card">
        <div id="twisterText" class="twister-text">Press a difficulty to begin</div>

        <div class="nav-under">
          <button id="btnBack">← Back</button>
          <button id="btnNext">Next →</button>
        </div>

        <div class="instruction">Cakap Betul Betul, Bulat Bulat!</div>
      </div>

      <!-- Stage -->
      <div class="stage" aria-live="polite">
        <div class="left">
          <button id="micBtn" class="mic-button" aria-pressed="false" title="Tap to record">
            <svg id="micIcon" width="36" height="36" viewBox="0 0 24 24" fill="none" style="display:block">
              <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3z" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M19 11v1a7 7 0 0 1-14 0v-1" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M12 19v3" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span id="micLabel" style="display:block;font-size:12px;margin-top:6px;">Tap to record</span>
          </button>
        </div>

        <div class="center">
          <div class="mic-meter-wrap" aria-hidden="true">
            <div id="micMeterBar" class="mic-meter" style="height:6px; transform:rotate(-90deg); width:120px;"></div>
          </div>
        </div>

        <div class="right">
          <div style="text-align:center;">
            <div style="font-size:11px;color:#64748b;font-weight:700;margin-bottom:6px;">Score</div>
            <div id="scoreRing" class="score-ring" style="--score-percent:0%;">
              <div class="score-inner" id="scoreInner">0</div>
            </div>
          </div>
        </div>
      </div>

      <div id="transcript" class="transcript" aria-live="polite"></div>

      <div class="footer-note"><strong>Tongue Twister Trainer</strong> — Created by <strong>Speak Up! Drama</strong></div>
    </main>
  </div>

<script>
/* ========== CONFIG: point to your GitHub raw PDF ========== */
/* repo: akademimuzikshahalam-rgb / tongue-twister-trainer
   file in repo: Speak Up Logo.pdf (main branch)
   raw URL constructed below (spaces encoded)
*/
const GITHUB_LOGO_PDF = 'https://raw.githubusercontent.com/akademimuzikshahalam-rgb/tongue-twister-trainer/main/Speak%20Up%20Logo.pdf';
const LOCAL_PNG = './Speak Up Logo.png'; // if you later replace PDF with PNG or add PNG, code will try this first

/* =========================
   Tongue twisters
   ========================= */
const twisters = {
  easy: [
    "She sells seashells.",
    "Blue bird flew.",
    "Kitty Cat ate a rat.",
    "Yellow sun shines",
    "Tiny toy train"
  ],
  medium: [
    "She sells seashells at the seashore, the shells she sells are surely seashells",
    "Peter Piper picked a peck of pickled peppers.",
    "Red lorry, yellow lorry, red lorry, yellow lorry",
    "Unique New York, unique New York, you need New York!",
    "If two witches would watch two watches, which witch would watch which watch?"
  ],
  hard: [
    "How much wood would a woodchuck chuck if a woodchuck could chuck wood. He would chuck as much wood as he could as a woodchck could chuck wood. ",
    "Peter Piper picked a pack of pickled peppers. A pack of pickled peppers Peter Piper picked. If Peter Piper picked and pack of pickled peppers, where's the pack of pickled peppers Peter Piper Picked?",
    "I saw Susie sitting in a shoeshine shop where she shines she works, and where she works, she shines!",
    "Irish wristwatch, Irish wristwatch",
    "Red leather, yellow leather"
  ]
};

/* =========================
   UI references & state
   ========================= */
let currentLevel = null;
let currentIndex = 0;
const twisterTextEl = document.getElementById('twisterText');
const btnBack = document.getElementById('btnBack');
const btnNext = document.getElementById('btnNext');
const btnEasy = document.getElementById('btnEasy');
const btnMed  = document.getElementById('btnMed');
const btnHard = document.getElementById('btnHard');
const micBtn = document.getElementById('micBtn');
const micLabel = document.getElementById('micLabel');
const micMeterBar = document.getElementById('micMeterBar');
const scoreInnerEl = document.getElementById('scoreInner');
const scoreRing = document.getElementById('scoreRing');
const transcriptBox = document.getElementById('transcript');
const logoImg = document.getElementById('logoImg');
const logoObj = document.getElementById('logoObj');

/* load logo: prefer local PNG, fallback to GitHub PDF object */
(function loadLogo(){
  // try local PNG first (fast path)
  const tempImg = new Image();
  tempImg.onload = () => {
    logoImg.src = LOCAL_PNG;
    logoImg.style.display = 'inline-block';
    logoObj.style.display = 'none';
  };
  tempImg.onerror = () => {
    // fallback to GitHub raw PDF: load into <object>
    logoImg.style.display = 'none';
    logoObj.data = GITHUB_LOGO_PDF;
    logoObj.style.display = 'inline-block';
    // object may not render as tiny icon in some browsers; acceptable as fallback
  };
  tempImg.src = LOCAL_PNG;
})();

/* difficulty buttons */
btnEasy.addEventListener('click', ()=> startLevel('easy'));
btnMed.addEventListener('click', ()=> startLevel('medium'));
btnHard.addEventListener('click', ()=> startLevel('hard'));
btnBack.addEventListener('click', ()=> navigate(-1));
btnNext.addEventListener('click', ()=> navigate(1));

function startLevel(level) {
  currentLevel = level;
  currentIndex = 0;
  showTwister();
  // simple UI emphasis
  [btnEasy, btnMed, btnHard].forEach(b => b.style.opacity = '1');
  if (level === 'easy') btnMed.style.opacity = btnHard.style.opacity = '0.7';
  if (level === 'medium') btnEasy.style.opacity = btnHard.style.opacity = '0.7';
  if (level === 'hard') btnEasy.style.opacity = btnMed.style.opacity = '0.7';
}

function navigate(delta){
  if (!currentLevel) return;
  const list = twisters[currentLevel];
  currentIndex = (currentIndex + delta + list.length) % list.length;
  showTwister();
}

function showTwister(){
  twisterTextEl.innerText = twisters[currentLevel][currentIndex];
  transcriptBox.style.display = 'none';
  transcriptBox.innerText = '';
  resetScore();
}

/* =========================
   Speech / Mic Meter
   ========================= */
let recognition = null;
let isListening = false;
let transcript = '';
let startTime = 0;
let stopTime = 0;

/* audio analyser for live mic level */
let audioCtx = null;
let analyser = null;
let meterStream = null;
let meterAnimationId = null;

async function setupMicMeter() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('getUserMedia is not supported in this browser. Use Chrome or Edge.');
    return false;
  }
  if (meterStream) return true;
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(meterStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    drawMeter();
    return true;
  } catch (err) {
    console.warn('Microphone permission or error', err);
    alert('Microphone permission denied or not available.');
    return false;
  }
}

function stopMicMeter() {
  if (meterAnimationId) cancelAnimationFrame(meterAnimationId);
  meterAnimationId = null;
  if (analyser){ analyser.disconnect(); analyser=null; }
  if (meterStream){ meterStream.getTracks().forEach(t=>t.stop()); meterStream=null; }
  micMeterBar.style.transform = 'rotate(-90deg) scaleX(0.03)';
}

function drawMeter() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.fftSize);
  function loop(){
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i=0;i<data.length;i++){
      const v = (data[i]-128)/128;
      sum += v*v;
    }
    const rms = Math.sqrt(sum / data.length);
    const level = Math.min(1, Math.max(0.03, rms * 6)); // 0.03..1
    micMeterBar.style.transform = `rotate(-90deg) scaleX(${level})`;
    meterAnimationId = requestAnimationFrame(loop);
  }
  loop();
}

/* SpeechRecognition */
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('SpeechRecognition API not supported. Please use Chrome or Edge.');
    return false;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=> {
    isListening = true;
    micBtn.classList.add('listening');
    micBtn.setAttribute('aria-pressed','true');
    micLabel.innerText = 'Listening...';
    transcript = '';
    startTime = performance.now();
  };

  recognition.onresult = (ev)=> {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const segment = ev.results[i][0].transcript.trim();
      if (ev.results[i].isFinal) transcript += segment + ' ';
      else interim += segment + ' ';
    }
    const display = (transcript + interim).trim();
    if (display.length) {
      transcriptBox.style.display = 'block';
      transcriptBox.innerText = display;
    }
  };

  recognition.onerror = (e) => {
    console.warn('recognition error', e);
    micLabel.innerText = 'Error';
    stopRecording();
  };

  recognition.onend = ()=> {
    if (isListening) {
      // try to restart automatically for continuous listening
      try { recognition.start(); } catch(e) { console.warn('restart failed', e); }
    } else {
      stopTime = performance.now();
      finalizeResult();
    }
  };

  return true;
}

micBtn.addEventListener('click', async ()=> {
  if (!currentLevel) {
    alert('Please select a difficulty (Easy / Medium / Hard) first.');
    return;
  }
  if (isListening) {
    stopRecording();
  } else {
    const ok = await setupMicMeter();
    if (!ok) return;
    if (!recognition) {
      const okRec = initRecognition();
      if (!okRec) return;
    }
    try {
      transcript = '';
      transcriptBox.style.display = 'none';
      recognition.start();
    } catch (err) {
      console.warn('recognition.start error', err);
      try { recognition.stop(); } catch(e){}
      setTimeout(()=> { try { recognition.start(); } catch(e){ console.warn('start retry failed', e);} }, 200);
    }
  }
});

function stopRecording() {
  isListening = false;
  micBtn.classList.remove('listening');
  micBtn.setAttribute('aria-pressed','false');
  micLabel.innerText = 'Tap to record';
  if (recognition) {
    try { recognition.stop(); } catch(e) { console.warn(e); }
  }
  stopMicMeter();
}

function finalizeResult(){
  stopTime = stopTime || performance.now();
  const durationSec = Math.max(0.5, (stopTime - startTime) / 1000);
  const original = twisters[currentLevel][currentIndex];
  showResult(original, (transcript||'').trim(), durationSec);
}

/* =========================
   Scoring algorithm
   ========================= */
function showResult(original, spoken, durationSec) {
  const score = calculateCompositeScore(original, spoken, durationSec);
  scoreInnerEl.innerText = score;
  scoreRing.style.setProperty('--score-percent', (score*10) + '%');

  if (!spoken || spoken.length === 0) {
    transcriptBox.style.display = 'block';
    transcriptBox.innerText = 'No speech detected. Try again.';
  }

  if (score >= 10) {
    playFireworks(true);
  } else if (score >= 8) {
    playFireworks(false);
  }
}

function calculateCompositeScore(original, spoken, durationSec) {
  const oWords = original.toLowerCase().replace(/[^\w\s']/g,'').split(/\s+/).filter(Boolean);
  const sWords = (spoken||'').toLowerCase().replace(/[^\w\s']/g,'').split(/\s+/).filter(Boolean);
  if (sWords.length < Math.max(1, Math.floor(oWords.length * 0.45))) return 1;

  let exactMatches = 0;
  let claritySum = 0;
  const used = new Set();
  oWords.forEach(ow => {
    let bestIdx = -1, bestSim = 0;
    for (let i=0;i<sWords.length;i++){
      if (used.has(i)) continue;
      const sim = levenshteinSimilarity(ow, sWords[i]);
      if (sim > bestSim) { bestSim = sim; bestIdx = i; }
    }
    if (bestIdx >= 0 && bestSim >= 0.5) {
      used.add(bestIdx);
      claritySum += bestSim;
      if (bestSim >= 0.85) exactMatches++;
    }
  });

  const accuracy = exactMatches / oWords.length;
  const clarity = (used.size > 0) ? (claritySum / used.size) : 0;
  const wps = (sWords.length) / Math.max(0.5, durationSec);
  const ideal = 2.0;
  const maxDev = 2.0;
  const speedScore = Math.max(0, 1 - (Math.abs(wps - ideal) / maxDev));

  const wAcc = 0.6, wClarity = 0.2, wSpeed = 0.2;
  const combined = (wAcc * accuracy) + (wClarity * clarity) + (wSpeed * speedScore);
  let raw = Math.round(combined * 10);
  raw = Math.max(1, Math.min(10, raw));
  return raw;
}

/* levenshtein helpers */
function levenshteinSimilarity(a,b) {
  a=a||''; b=b||'';
  const longer = a.length >= b.length ? a : b;
  const shorter = a.length >= b.length ? b : a;
  if (longer.length === 0) return 1;
  const ed = getEditDistance(longer, shorter);
  return (longer.length - ed) / longer.length;
}
function getEditDistance(a,b){
  const costs = new Array(b.length+1);
  for (let j=0;j<=b.length;j++) costs[j]=j;
  for (let i=1;i<=a.length;i++){
    let prev = i;
    for (let j=1;j<=b.length;j++){
      let curr = costs[j];
      let add = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1;
      const val = Math.min(Math.min(costs[j]+1, prev+1), costs[j-1]+add);
      costs[j-1] = prev;
      prev = val;
      if (j === b.length) costs[j] = prev;
    }
  }
  return costs[b.length];
}

function resetScore(){
  scoreInnerEl.innerText = '0';
  scoreRing.style.setProperty('--score-percent','0%');
  transcriptBox.style.display = 'none';
  transcriptBox.innerText = '';
}

/* =========================
   Fireworks visuals + audio
   ========================= */
function playFireworks(perfect){
  const durationMs = perfect ? 2200 : 1200;
  const particleCount = perfect ? 110 : 60;
  createParticles(particleCount, perfect ? 1400 : 800);
  playFireworkSound(perfect);
}
function createParticles(count, travelDist){
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '0';
  container.style.top = '0';
  container.style.width = '100%';
  container.style.height = '100%';
  container.style.pointerEvents = 'none';
  container.style.zIndex = 9999;
  document.body.appendChild(container);
  const colors = ['#fbbf24','#f97316','#fb7185','#60a5fa','#34d399','#a78bfa','#fcd34d'];
  for (let i=0;i<count;i++){
    const p = document.createElement('div');
    p.style.position = 'absolute';
    p.style.left = (window.innerWidth * 0.5 + (Math.random()*300 - 150)) + 'px';
    p.style.top = (window.innerHeight * 0.35 + (Math.random()*200 - 100)) + 'px';
    const size = Math.random()*8 + 6;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.borderRadius = '50%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.boxShadow = '0 0 10px ' + p.style.background;
    p.style.transform = 'translate(0,0) scale(1)';
    p.style.opacity = '1';
    container.appendChild(p);
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random()*travelDist;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    p.animate([
      { transform: 'translate(0,0) scale(1)', opacity:1 },
      { transform: `translate(${tx}px, ${ty}px) scale(0.3)`, opacity:0 }
    ], {
      duration: perfect ? 1800 + Math.random()*700 : 900 + Math.random()*400,
      easing: 'cubic-bezier(.2,.8,.2,1)'
    });
    setTimeout(()=> p.remove(), perfect ? 2400 : 1100);
  }
  setTimeout(()=> container.remove(), perfect ? 2600 : 1200);
}
function playFireworkSound(perfect){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const bursts = perfect ? 10 : 6;
    for (let b=0;b<bursts;b++){
      const t = now + b * (perfect ? 0.18 : 0.2);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(400 + Math.random()*800, t);
      o.frequency.exponentialRampToValueAtTime(60, t + (perfect?0.6:0.35));
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (perfect?0.9:0.4));
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + (perfect?1.0:0.45));
    }
    if (perfect){
      const ping1 = ctx.createOscillator();
      const g1 = ctx.createGain();
      ping1.type='triangle';
      ping1.frequency.setValueAtTime(1000, now + 0.18);
      g1.gain.setValueAtTime(0.16, now+0.18);
      g1.gain.exponentialRampToValueAtTime(0.001, now+0.9);
      ping1.connect(g1); g1.connect(ctx.destination);
      ping1.start(now+0.18); ping1.stop(now+0.9);
    }
  } catch(e){ console.warn('AudioContext error', e); }
}

/* init defaults */
resetScore();

</script>
