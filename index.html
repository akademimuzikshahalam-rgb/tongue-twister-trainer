<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Speak Up! — Tongue Twister Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-1:#6d71f2; /* header gradient start */
    --accent-2:#8b58b9; /* header gradient end */
    --card-bg:#fff;
    --muted:#64748b;
    --green:#10b981;
    --orange:#f59e0b;
    --red:#ef4444;
    --shadow: 0 18px 50px rgba(12,23,63,0.14);
    --card-radius:18px;
  }
  *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(180deg,#6e62c9 0%, #6f5fcf 50%, #6f5fcf 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }

  .container{
    width:100%;
    max-width:1220px;
    border-radius:24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.02) 100%);
    padding:22px;
    box-shadow:var(--shadow);
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  }

  header.top {
    background: linear-gradient(180deg,var(--accent-1),var(--accent-2));
    padding:32px 36px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    position:relative;
  }
  .logo-wrap { width:120px; display:flex; align-items:flex-start; }
  img.logo { width:120px; height:auto; display:block; object-fit:contain; border-radius:6px; background:#fff; padding:6px; }
  .header-center { flex:1; text-align:center; color:#fff; padding-top:2px; }
  .header-center h1 { margin:0; font-family:Poppins, sans-serif; font-weight:700; font-size:40px; letter-spacing:0.2px; text-shadow:0 3px 12px rgba(0,0,0,0.08); }
  .header-center p { margin:6px 0 0; opacity:0.95; font-size:16px; }

  .header-right { min-width:220px; text-align:right; color:rgba(255,255,255,0.95); font-weight:600; align-self:flex-end; padding-top:4px; }

  /* main card body */
  .card-body { padding:28px 36px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .choose-title { font-size:18px; font-weight:800; color:#334155; letter-spacing:0.2px; }
  .created-right { color:#94a3b8; font-weight:700; }

  hr.div { border:0; height:1px; background:linear-gradient(90deg,#e6eefc,#f3f6ff); margin:18px 0; }

  /* difficulty buttons group */
  .center-controls { display:flex; justify-content:center; gap:22px; margin:26px 0 6px; }
  .btn {
    min-width:120px;
    padding:12px 20px;
    border-radius:12px;
    border:none;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(12,20,40,0.06);
  }
  .btn.easy { background:var(--green); color:#fff; }
  .btn.medium { background:var(--orange); color:#fff; }
  .btn.hard { background:var(--red); color:#fff; }

  /* challenge text */
  .challenge { margin-top:12px; color:#334155; font-weight:700; font-size:16px; }

  /* big footer gradient bar inside the card */
  .big-footer {
    margin-top:20px;
    height:56px;
    border-radius:8px;
    background: linear-gradient(90deg,var(--accent-1),var(--accent-2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-family:Poppins, sans-serif;
    font-size:18px;
  }

  /* responsive */
  @media (max-width:920px){
    .header-center h1 { font-size:28px; }
    .logo-wrap { width:96px; }
    .header-right { display:none; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <header class="top">
        <div class="logo-wrap">
          <img id="logoImg" class="logo" alt="Speak Up Logo" src="" />
        </div>

        <div class="header-center">
          <h1>Tongue Twister Trainer</h1>
          <p>Practice speaking clearly</p>
        </div>

        <div class="header-right">Created By Teacher Gilbert</div>
      </header>

      <div class="card-body">
        <div class="row" style="align-items:center;">
          <div class="choose-title">CHOOSE DIFFICULTY</div>
          <div class="created-right">Created By Teacher Gilbert</div>
        </div>

        <div class="center-controls" role="tablist" aria-label="difficulty">
          <button id="btnEasy" class="btn easy">Easy</button>
          <button id="btnMed" class="btn medium">Medium</button>
          <button id="btnHard" class="btn hard">Hard</button>
        </div>

        <hr class="div" />

        <div class="challenge">Challenge <span id="challengeIndex">1</span> of <span id="challengeTotal">6</span></div>

        <div class="big-footer" id="bigFooter">Created By Teacher Gilbert</div>
      </div>
    </div>
  </div>

<script>
/* Logo loading: try local PNG first, else fallback to GitHub raw PDF as raster via object is awkward,
   but we still try the PDF by constructing its raw URL (useful if PNG isn't in the repo).
*/
const LOCAL_PNG = './Speak Up Logo.png';
const GITHUB_PDF_RAW = 'https://raw.githubusercontent.com/akademimuzikshahalam-rgb/tongue-twister-trainer/main/Speak%20Up%20Logo.pdf';
const logoImg = document.getElementById('logoImg');

(function loadLogo(){
  const imgTest = new Image();
  imgTest.onload = () => {
    logoImg.src = LOCAL_PNG;
  };
  imgTest.onerror = () => {
    // fallback: try to convert PDF -> PNG via GitHub raw (browsers won't show PDF in <img>)
    // Instead, try to request a PNG at the same path (common if you upload both)
    const altPng = GITHUB_PDF_RAW.replace('.pdf', '.png');
    const alt = new Image();
    alt.onload = () => { logoImg.src = altPng; };
    alt.onerror = () => {
      // final fallback: use the PDF as a data URI preview is not reliable; keep a simple empty placeholder
      logoImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80"><rect width="100%" height="100%" fill="#fff"/><text x="10" y="45" font-family="Poppins, sans-serif" font-weight="700" font-size="28" fill="#111">SPEAK UP!</text></svg>');
    };
    alt.src = altPng;
  };
  imgTest.src = LOCAL_PNG;
})();

/* Small interactivity: update challenge counter when user clicks difficulty */
const btnEasy = document.getElementById('btnEasy');
const btnMed  = document.getElementById('btnMed');
const btnHard = document.getElementById('btnHard');
const challengeIndex = document.getElementById('challengeIndex');
const challengeTotal = document.getElementById('challengeTotal');
const bigFooter = document.getElementById('bigFooter');

let total = 6;
challengeTotal.innerText = total;
let idx = 1;
challengeIndex.innerText = idx;

function choose(level){
  // visual feedback: briefly animate footer and increase challenge count (demo)
  bigFooter.innerText = `You chose ${level.toUpperCase()} — Created By Teacher Gilbert`;
  // increment demo counter
  idx = 1;
  challengeIndex.innerText = idx;
  // navigate to trainer page if you want (not implemented here — just demo)
  bigFooter.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}], {duration:420, easing:'ease', iterations:1});
}

btnEasy.addEventListener('click', ()=> choose('easy'));
btnMed.addEventListener('click', ()=> choose('medium'));
btnHard.addEventListener('click', ()=> choose('hard'));
</script>
</body>
</html>
